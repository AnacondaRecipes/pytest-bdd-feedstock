{% set name = "pytest-bdd" %}
{% set version = "9.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pytest-dev/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 55dc98ce68ab16656bd36b7fc585c78e8d155d1d9e2d72a6f2774a53ad6e880e

build:
  number: 0
  skip: true  # [py<310]
  entry_points:
    - pytest-bdd = pytest_bdd.scripts:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - uv-build >=0.12.13,<0.13.0
  run:
    - python
    - mako
    - parse
    - parse_type
    - pytest >=7.0.0
    - typing-extensions
    - packaging
    - gherkin-official >=29.0.0,!=31.0.0,!=32.0.0


# These tests generally have problems with paths on Windows
#E AssertionError: assert 'migrated: C:...\\__init__.py' == 'migrated: C:...s/__init__.py'
#E assert 'C:\\does\\not\\exist\\steps.feature' in "[Errno 2] No such file or directory: 'C:\\\\does\\\\not\\\\exist\\\\steps.feature'"
{% set disabled_tests = " test_feature_path_not_found" %}
{% set disabled_tests = disabled_tests+ " or test_feature_path_by_param_not_found" %}
{% set disabled_tests = disabled_tests+ " or test_generate" %}
{% set disabled_tests = disabled_tests+ " or test_migrate" %}

test:
  source_files:
    - tests
    - src
    - pyproject.toml
    - pytest.ini
  imports:
    - pytest_bdd
  requires:
    - pip
  commands:
    - pip check
    - pytest-bdd --help
    - pytest -vv tests -k "not ({{ disabled_tests }})"  # [win]
    - pytest -vv tests  # [not win]

about:
  home: https://pytest-bdd.readthedocs.io
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: BDD for pytest
  description: pytest-bdd implements a subset of the Gherkin language to enable automating project requirements testing and to facilitate behavioral driven development.
  dev_url: https://github.com/pytest-dev/pytest-bdd
  doc_url: https://pytest-bdd.readthedocs.io

extra:
  recipe-maintainers:
    - m0nonoke
    - PertuyF
    - breathe
  skip-lints:
    - missing_wheel
